name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Paketlar
        run: npm ci

      - name: Build — sahifalar, SEO, havolalar, CSP, /admin/, backend sozlamasi
        run: npm run test:build

      - name: Backend — backend/schema.sql (PostgreSQL 17, PGlite)
        run: npm run test:db

      - name: Brauzer — menyu, forma, video filtrlari, /admin/ oqimi (headless Chrome)
        run: npm run test:ui
